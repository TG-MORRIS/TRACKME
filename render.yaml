services:
  - type: web
    name: trackme
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
